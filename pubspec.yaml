name: ruok_app_practical_task
description: "RU OK Personal Safety Alert Timer App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^22.3.0
  android_alarm_manager_plus: ^5.1.1
  geolocator: ^14.0.3
  intl: ^0.20.3
  flutter_screenutil_plus: ^1.6.0
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/json/
